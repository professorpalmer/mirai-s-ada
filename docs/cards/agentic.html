<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<link rel="stylesheet" href="card.css">
<div class="card" id="card"></div>
<script src="card.js"></script>
<script>
(function () {
  var D = DATA;
  var body = card({
    eyebrow: 'Agent work · RTX 4070 12 GB',
    title: 'AppWorld 88.7 % on one 12 GB card, and faster agent turns',
    foot: D.foot
  });
  var left = panel(body, 'AppWorld, 168 tasks, task goals %', '1');
  hbars(left, D.appworld.map(function (r, i) { var o = { label: r.label, note: r.note }; o['s' + i] = { v: r.v, text: fmt(r.v, 1) }; return o; }),
    D.appworld.map(function (r, i) { return { key: 's' + i, name: r.label, color: r.color }; }),
    { W: 480, H: 340, labelW: 0, R: 70, max: 100, barH: 30, valSize: 24, below: true });
  var right = panel(body, 'Before → now, same output', '1.25');
  colTable(right, [
    { key: 'before', name: 'Before', sub: '', color: COLOR.ref },
    { key: 'now', name: 'Now', sub: '', color: COLOR.serve, focus: true }
  ], D.rows, { labelFr: '1.35fr' });
})();
</script>
