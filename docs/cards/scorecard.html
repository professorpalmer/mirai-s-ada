<!doctype html>

<title>Mirai S scorecard</title>
<!-- The main card (README). Every number is in DATA below, each with its source. Edit DATA, then run
     bench/render_cards.ps1. Rendered at 1200 x 675, device scale 2. null = not measured (the card says so). -->
<script>
var DATA = {
  // Small print under the card, one line per column.
  foot: [
    'This serve: RTX 4070 12 GB, q8_0 K/V, defaults of bundle-20261019d (replay rollback, a draft of 4 past the VRAM line). Positions in VRAM and decode (300-token answers, the mean of story / code / quote): receipts/tail4, 2026-10-19.',

  ],
  rows: [
    { label: 'Context window', note: 'q8_0 K/V',
      ref: { v: '64k', unit: '11.0 GB' },               // the first-comparison table in docs/speed/README.md (receipts/mirai-port/profile-stock-fork-q8-64k.txt)
      serve: { v: '262,144', unit: 'tokens' } },         // start-server.ps1 default MIRAI_CTX

      ref: { t: 'all of its 64k window' },
      serve: { v: '67,328', unit: 'of 262,144' } },     // receipts/tail4 arm d4 (the bundle-20261019c launcher line)
    { label: 'Decode at 4k', note: 'tok/s',
      ref: { v: '39.6' },                                // profile-stock-fork-q8-64k.txt depth 4000, mean decode
      serve: { v: '70.1' } },                            // receipts/tail4 d4, 4k: mean of story 55.2 / code 63.0 / quote 92.1
    { label: 'Decode at 64k', note: 'tok/s',
      ref: { v: '33.5', unit: 'at 60k' },                // profile-stock-fork-q8-64k.txt depth 60000, mean decode
      serve: { v: '60.9' } },                            // receipts/tail4 d4, 64k: mean of 39.8 / 59.6 / 83.2

      ref: { t: 'past its 64k window' },

      ref: null,
      serve: { v: '161', unit: '/ 164' } },              // receipts/kvq3 arm q8 (bundle-20261019c root, through the layer)
    { label: 'AppWorld, 168 tasks', note: 'code agent',
      ref: null,
      serve: { v: '88.7 %', unit: 'task goals' } },       // receipts/mirai-port/appworld.log, aggregate task_goal_completion

      ref: { t: 'past its 64k window' },

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<link rel="stylesheet" href="card.css">
<div class="card" id="card"></div>
<script src="card.js"></script>
<script>
(function () {
  var body = card({
    eyebrow: 'Mirai S 27B · RTX 4070 12 GB · one slot',
    title: 'The full 262k window and drafting at every depth on 12 GB',
    foot: DATA.foot
  });
  colTable(body, [
    { key: 'ref', name: 'The reference fork', sub: 'the starting point, same weights', color: COLOR.ref },
    { key: 'serve', name: 'This serve', sub: 'bundle-20261019d defaults', color: COLOR.serve, focus: true, fr: '1.1fr' }
  ], DATA.rows);
})();
</script>
